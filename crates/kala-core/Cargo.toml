[package]
name = "kala-core"
version.workspace = true
edition.workspace = true

[lib]
name = "kala_core"

[features]
# Test-only hooks (`World::inject_log_fault`, `World::tamper_index`,
# `World::at_canon_main`, `LogFault`, `Tamper`). Off by default: not part of
# the supported API.
test-hooks = []

[lints]
workspace = true

[dependencies]
# Case-insensitive search (`value::fold_for_search`): Unicode default full
# case folding and NFC/NFD (security-consultant approved, slice 4).
caseless = "0.2.2"
crc32fast = "1.5.5"
unicode-normalization = "0.1.26"

[dev-dependencies]
# The crate's own tests use the test hooks.
kala-core = { path = ".", features = ["test-hooks"] }
# Integration tests and the README doctest build worlds from YAML fixtures.
kala-fixture = { path = "../kala-fixture" }
proptest = "1.12.0"
tempfile = "3.27.0"
crc32fast = "1.5.5"
