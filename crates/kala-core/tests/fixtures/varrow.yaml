# The Varrow chronicle: a fixture world for Kala's acceptance tests.
#
# One tick is one YEAR of the world's own calendar (negative years are normal).
# The story, in the order the AUTHOR wrote it (each `transactions` entry below is one
# author edit, so its position is its `tx`); story time is the `tick:` on each op.
#
#  1. places get their names and rulers          5. Greg in Varrow @200 (tx#50 of CLAUDE.md)
#  2. the old guard                              6. Lisa's war
#  3. 24 villagers, each with a home and a move  7. Greg in Ashford @601 -> an OVERLAP (a draft)
#  4. Edwin's story                              8. a PREQUEL (written late, earlier ticks)
#                                                9. Greg left Varrow @250 -> overlap resolved
#                                               10. a new character, 11. the RETCON
#
# Moves are always explicit: retract the old place and assert the new one at one tick.
schema:
  node_types: [CHARACTER, PLACE, ITEM, EVENT]
  attributes:
    - { name: name,       type: string }
    - { name: alias,      type: string, cardinality: many }
    - { name: label,      type: string, cardinality: many }       # extra labels (Cypher :Character:Deity)
    - { name: biography,  type: string, indexed: false }          # long text, no V entries
    - { name: located_in, type: ref }                             # cardinality one is a LABEL
    - { name: ally_of,    type: ref, cardinality: many, direction: bidirectional }
    - { name: ruled_by,   type: ref, reverse: one }               # a place has one ruler, a ruler rules one place
    - { name: present,    type: ref, cardinality: many }          # edge with properties
    - { name: disguised,  type: bool }                            # property of a `present` edge
    - { name: bought,     type: ref, kind: event, cardinality: many }
    - { name: born_in,    type: ref, kind: event, cardinality: many }

entities:
  CHARACTER: [edwin, greg, mara, lisa, tomas, hild, osric, wren, v01, v02, v03, v04, v05, v06, v07, v08, v09, v10, v11, v12, v13, v14, v15, v16, v17, v18, v19, v20, v21, v22, v23, v24]
  PLACE: [varrow, ashford, carnath, eldoria, dunmere, highkeep, saltmarsh, oakhollow, redcliff, stonebridge, thornwick, whitefall, mistral, graymoor]
  ITEM: [sword, crown]
  EVENT: [battle_of_ashford]

