[package]
name = "kala-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kala"
path = "src/main.rs"

[dependencies]
kala-core = { path = "../kala-core" }
# `kala query` / `kala explain` (internal crates).
kala-query = { path = "../kala-query" }
kala-datalog = { path = "../kala-datalog" }
# Argument parsing; no `color` (no ANSI in output), no argfiles, no env args
# (security-consultant approved, slice 5).
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# `--json` output from `#[derive(Serialize)]` structs (security-consultant
# approved, slice 5).
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# End-to-end tests run the real binary in temp dirs and parse its JSON output
# (security-consultant approved, slice 5).
tempfile = "3.27.0"
serde_json = "1.0.154"
