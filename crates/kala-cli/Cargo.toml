[package]
name = "kala-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kala"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kala-core = { path = "../kala-core" }
# `kala query` / `kala explain` (internal crates).
kala-query = { path = "../kala-query" }
kala-datalog = { path = "../kala-datalog" }
kala-cypher = { path = "../kala-cypher" }
kala-bolt = { path = "../kala-bolt" }
# Argument parsing; no `color` (no ANSI in output), no argfiles, no env args
# (security-consultant approved, slice 5).
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# `--json` output from `#[derive(Serialize)]` structs (security-consultant
# approved, slice 5).
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# Minimal terminal editing and interactive-only cancellation; security-consultant
# approved for the read-only REPL. Persistence uses our bounded history wrapper.
rustyline = { version = "=19.0.0", default-features = false }
ctrlc = { version = "=3.5.3", default-features = false }
# Security-consultant approved: hidden terminal password input, no optional features.
rpassword = { version = "=7.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# Security-consultant approved: platform constants only, for safe nonblocking,
# no-follow history opens. Already transitive through the terminal crates.
libc = "0.2"

[dev-dependencies]
# End-to-end tests run the real binary in temp dirs and parse its JSON output
# (security-consultant approved, slice 5).
tempfile = "3.27.0"
serde_json = "1.0.154"
proptest = "1.12.0"
