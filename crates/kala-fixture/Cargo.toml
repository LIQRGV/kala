[package]
name = "kala-fixture"
version.workspace = true
edition.workspace = true

[lib]
name = "kala_fixture"

[lints]
workspace = true

[dependencies]
kala-core = { path = "../kala-core" }
# YAML fixture loader: pure Rust, forbid(unsafe_code); only the
# `deserialize` feature (security-consultant approved, slice 4 items 6/7).
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
# The loader's tests use kala-core's test hooks.
kala-core = { path = "../kala-core", features = ["test-hooks"] }
proptest = "1.12.0"
tempfile = "3.27.0"
crc32fast = "1.5.5"
