[package]
name = "kala-bolt"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
kala-core = { path = "../kala-core" }
kala-query = { path = "../kala-query" }
# The query front-ends behind one interface.
kala-lang = { path = "../kala-lang" }
# The `system` database: accounts, privileges and password verification.
kala-system = { path = "../kala-system" }

[dev-dependencies]
kala-fixture = { path = "../kala-fixture" }
tempfile = "3.27.0"
proptest = "1.12.0"

[target.'cfg(unix)'.dependencies]
# Safe descriptor-relative filesystem operations and nonblocking stale probes.
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
# Platform sockaddr_un layout only; no unsafe calls.
libc = "0.2"
# Private staging directory (asked for mode 0700 at mkdir) for publishing a socket.
tempfile = "3.27.0"
