[workspace]
resolver = "3"
members = ["crates/kala-core", "crates/kala-fixture", "crates/kala-cli", "crates/kala-query", "crates/kala-datalog", "crates/kala-bolt", "crates/kala-cypher"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# One lint policy for every crate (each opts in with `[lints] workspace = true`);
# CI runs clippy with `-D warnings`, so a warning here fails the build.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
